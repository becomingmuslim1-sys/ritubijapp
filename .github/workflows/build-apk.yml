name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Android Platform & APK
        run: |
          cordova platform add android
          cordova build android --debug
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/Ritubij.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritubij-App-APK
          path: platforms/android/app/build/outputs/apk/debug/Ritubij.apk
