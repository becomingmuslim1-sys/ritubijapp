name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Customer APK
        run: |
          cordova platform add android
          cordova build android --debug
          mkdir -p apks
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk apks/Ritubij.apk

      - name: Build Admin APK
        run: |
          cordova platform rm android
          sed -i 's/<name>Ritubij<\/name>/<name>Ritubij Admin<\/name>/' config.xml
          sed -i 's/id="com.ritubij.app"/id="com.ritubij.admin"/' config.xml
          sed -i 's/<content src="index.html" \/>/<content src="admin.html" \/>/' config.xml
          cordova platform add android
          cordova build android --debug
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk apks/Ritubij-Admin.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ritubij-APKs
          path: apks/*.apk
